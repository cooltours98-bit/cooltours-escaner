
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escáner QR | CoolTours-GDL</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .card {
      max-width: 480px;
      margin: 20px auto;
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 3px 14px #0001;
    }

    h1 {
      color: #e87524;
      font-size: 25px;
    }

    p {
      line-height: 1.5;
    }

    button {
      background: #e87524;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin: 6px;
    }

    button.secondary {
      background: #333;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      margin: 18px auto;
    }

    .small {
      font-size: 13px;
      color: #666;
    }

    #status {
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>COOLTOURS-GDL</h1>
    <h2>Escáner de boletos QR</h2>

    <p>
      Escanea el código QR del viajero para continuar con su check-in.
    </p>

    <button id="startBtn" onclick="startScanner()">
      Activar cámara
    </button>

    <button class="secondary" onclick="stopScanner()">
      Detener cámara
    </button>

    <div id="reader"></div>

    <p id="status">Cámara sin activar.</p>

    <p class="small">
      Permite el acceso a la cámara cuando Chrome lo solicite.
    </p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const appUrl = params.get('appUrl');
    const vehiculo = params.get('vehiculo') || '';

    let scanner = null;
    let processing = false;

    function setStatus(message) {
      document.getElementById('status').textContent = message;
    }

    async function startScanner() {
      if (scanner) return;

      if (!appUrl) {
        setStatus(
          'Abre el escáner desde el botón de la aplicación de check-in.'
        );
        return;
      }

      if (!window.Html5Qrcode) {
        setStatus(
          'No se pudo cargar el lector QR. Revisa tu conexión.'
        );
        return;
      }

      const button = document.getElementById('startBtn');
      button.disabled = true;
      button.textContent = 'Abriendo cámara...';

      try {
        scanner = new Html5Qrcode('reader');

        const cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          scanner = null;
          setStatus('No se encontró una cámara disponible.');
          button.disabled = false;
          button.textContent = 'Activar cámara';
          return;
        }

        const camera =
          cameras.find(c =>
            /back|rear|environment|trasera|posterior/i.test(c.label)
          ) || cameras[cameras.length - 1];

        await scanner.start(
          camera.id,
          {
            fps: 10,
            qrbox: { width: 250, height: 250 }
          },
          onScanSuccess,
          () => {}
        );

        setStatus(
          'Cámara activa. Enfoca el código QR del boleto.'
        );

        button.textContent = 'Cámara activa';

      } catch (error) {
        scanner = null;

        setStatus(
          'No se pudo abrir la cámara: ' +
          (error.message || error)
        );

        button.disabled = false;
        button.textContent = 'Activar cámara';
      }
    }

    async function stopScanner() {
      const current = scanner;
      scanner = null;

      try {
        if (current) {
          if (current.isScanning) {
            await current.stop();
          }

          await current.clear();
        }
      } catch (error) {}

      document.getElementById('reader').innerHTML = '';

      document.getElementById('startBtn').disabled = false;
      document.getElementById('startBtn').textContent = 'Activar cámara';

      if (!processing) {
        setStatus('Cámara detenida.');
      }
    }

    async function onScanSuccess(decodedText) {
      if (processing) return;

      processing = true;

      setStatus(
        'Código leído. Regresando al sistema para validar el boleto...'
      );

      await stopScanner();

      const separator = appUrl.includes('?') ? '&' : '?';

      const destination = appUrl + separator +
        'token=' + encodeURIComponent(decodedText) +
        '&vehiculo=' + encodeURIComponent(vehiculo);

      window.location.href = destination;
    }
  </script>
</body>
</html>
